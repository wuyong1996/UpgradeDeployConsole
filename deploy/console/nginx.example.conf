# Use a separate hostname and replace certificate paths before installing.
server {
    listen 443 ssl;
    server_name deploy.example.com;
    ssl_certificate /etc/ssl/deploy-console/fullchain.pem;
    ssl_certificate_key /etc/ssl/deploy-console/private.key;
    client_max_body_size 16k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:5088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }
}
